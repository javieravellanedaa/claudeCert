<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claudeCert · Claude Certified Architect</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2a3240;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#d97742; --accent2:#e89a6b;
    --ok:#2ea043; --warn:#d29922; --bad:#f85149; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.55;display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#131a24,#0d1117);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
  .logo span{color:var(--accent2)}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tab{padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);
    border:1px solid transparent}
  .tab:hover{background:var(--panel)}
  .tab.on{background:var(--panel2);color:#fff;border-color:var(--accent)}
  .spacer{flex:1}
  .search{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:10px;
    padding:8px 12px;font-size:14px;min-width:200px}
  #app{flex:1;display:flex;min-height:0}
  /* layout estudio */
  aside{width:280px;border-right:1px solid var(--border);padding:16px;overflow:auto;background:#0f141b}
  aside h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .mod{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
    cursor:pointer;border:1px solid transparent;font-size:13.5px}
  .mod:hover{background:var(--panel)}
  .mod.active{background:var(--panel2);border-color:var(--accent)}
  .mod .cnt{font-size:11.5px;color:var(--muted);background:#0d1117;border:1px solid var(--border);
    border-radius:20px;padding:1px 8px;white-space:nowrap}
  .bar{height:4px;border-radius:3px;background:#0d1117;margin:2px 12px 8px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ok);width:0}
  main{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
  .stage{width:100%;max-width:860px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;user-select:none}
  .chip.on{color:#fff;border-color:var(--accent);background:#2b2018}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:14px;
    font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--border)}
  .btn:disabled{opacity:.4;cursor:default}
  .progresswrap{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:13px}
  .pbar{width:130px;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .qmeta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:6px}
  .tag.vf{background:#3b2a12;color:#f0b354}
  .tag.mc{background:#12303b;color:#5ac8e0}
  .tag.open{background:#2b2018;color:var(--accent2)}
  .tag.mod{background:#22262e;color:var(--muted)}
  .tag.basic{background:#12261a;color:#4cc38a}
  .tag.intermediate{background:#2b2312;color:#e2b93b}
  .tag.advanced{background:#2a1416;color:#f97583}
  .tag.srcx{background:#1a2030;color:#8aa4c8}
  /* sesiones */
  .overlay{position:fixed;inset:0;background:rgba(5,8,12,.82);backdrop-filter:blur(4px);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .loginbox{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:400px;width:100%}
  .loginbox h2{margin:0 0 6px}
  .loginbox p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  .loginbox input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--txt);
    border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:10px}
  .loginbox .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-bottom:6px}
  .plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .pitem{padding:9px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:14px}
  .pitem:hover{border-color:var(--accent)}
  .userchip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
    border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;max-width:230px}
  .userchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bell{background:var(--panel2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .bell.on{border-color:var(--accent);background:#2b2018}
  /* código y diagramas embebidos */
  .codeblock{background:#0a0e14;border:1px solid var(--border);border-radius:10px;padding:14px 16px;
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;color:#c9d6e3;
    overflow-x:auto;white-space:pre;margin:0 0 14px;tab-size:2}
  .diag{background:#0a0e14;border:1px solid var(--border);border-radius:10px;padding:10px;margin:0 0 14px}
  .diag svg{width:100%;height:auto;display:block}
  .verifycode{font-size:30px;font-weight:800;letter-spacing:.25em;text-align:center;background:#0a0e14;
    border:1px dashed var(--warn);border-radius:10px;padding:12px;margin:10px 0;color:var(--warn)}
  .demonote{background:#2b2312;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;
    font-size:12px;color:#e2b93b;margin:8px 0}
  .dombar{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px}
  .dombar .nm{min-width:210px;text-align:left;color:var(--muted)}
  .qnum{color:var(--muted);font-size:13px;margin-left:auto}
  .question{font-size:19px;font-weight:650;margin:2px 0 16px;white-space:pre-wrap}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
  .opt{border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:12px 14px;cursor:pointer;
    display:flex;gap:10px;align-items:flex-start;font-size:15px}
  .opt:hover{border-color:var(--accent)}
  .opt .k{font-weight:700;color:var(--muted)}
  .opt.correct{border-color:var(--ok);background:#12261a}
  .opt.wrong{border-color:var(--bad);background:#2a1416}
  .opt.disabled{cursor:default}
  .answer{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px;display:none}
  .answer.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .answer h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
  .answer .body{font-size:15.5px}
  .answer .body strong{color:#fff}.answer .body ul{margin:8px 0;padding-left:20px}
  .answer .body li{margin:4px 0}.answer .body p{margin:8px 0}
  .verdict{font-weight:700;margin-bottom:8px}.verdict.v{color:var(--ok)}.verdict.f{color:var(--bad)}
  .assess{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
  .nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  .badge-known{color:var(--ok)}.badge-review{color:var(--warn)}
  footer{padding:9px 20px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;text-align:center}
  /* memoria */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcard{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:12px 14px;cursor:pointer;
    font-size:14.5px;transition:.15s;min-height:52px;display:flex;align-items:center}
  .mcard:hover{border-color:var(--accent)}
  .mcard.sel{border-color:var(--accent);background:#2b2018}
  .mcard.matched{opacity:.35;border-color:var(--ok);background:#12261a;cursor:default}
  .mcard.term{font-weight:700}
  .mcard.bad{border-color:var(--bad);background:#2a1416;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .stat{display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .stat b{font-size:22px}.stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .stbox{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 16px;text-align:center}
  select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px}
  /* examen */
  .exq{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .exq .lbl{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  textarea{width:100%;min-height:120px;background:#0d1117;border:1px solid var(--border);color:var(--txt);
    border-radius:10px;padding:12px;font-size:14.5px;font-family:inherit;resize:vertical}
  .radio{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
    margin:6px 0;cursor:pointer;font-size:15px}
  .radio:hover{border-color:var(--accent)}.radio.pick{border-color:var(--accent);background:#2b2018}
  .radio.rcorrect{border-color:var(--ok);background:#12261a}.radio.rwrong{border-color:var(--bad);background:#2a1416}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;background:var(--panel2);
    border:1px solid var(--border);padding:6px 14px;border-radius:10px}
  .timer.warn{color:var(--warn);border-color:var(--warn)}
  .selfgrade{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .sg{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-size:13px}
  .sg.on{color:#fff}.sg.g1.on{background:var(--ok);border-color:var(--ok)}
  .sg.g05.on{background:var(--warn);border-color:var(--warn);color:#111}.sg.g0.on{background:var(--bad);border-color:var(--bad)}
  .result{text-align:center;padding:30px}
  .score{font-size:60px;font-weight:800}.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
  .configbox{max-width:520px;margin:20px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px}
  .configrow{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px}
  @media(max-width:760px){aside{display:none}main{padding:14px}.question{font-size:17px}.matchgrid{gap:8px}.mcard{font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="logo">claude<span>Cert</span> <span style="font-size:12px;color:var(--muted);font-weight:600">· Certified Architect – Foundations</span></div>
  <div class="tabs">
    <div class="tab on" data-mode="estudio">📇 Estudio</div>
    <div class="tab" data-mode="memoria">🧩 Memoria</div>
    <div class="tab" data-mode="examen">📝 Examen</div>
    <div class="tab" data-mode="grupos">👥 Grupos</div>
  </div>
  <div class="spacer"></div>
  <input id="search" class="search" placeholder="🔍 Buscar…" style="display:none" />
  <button class="bell" id="bell" title="Recordatorios de estudio">🔔</button>
  <div id="userbox"></div>
</header>
<div id="loginOverlay" class="overlay" style="display:none"></div>
<div id="app"></div>
<footer>Claude Certified Architect – Foundations (CCA-F) · 60 preguntas / 120 min / 720 de 1000 para aprobar · sesión por email, progreso guardado por usuario en este navegador</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/cloud.js"></script>
<script src="data/questions.js"></script>
<script src="data/matches.js"></script>
<script src="data/enrich.js"></script>
<script>
/* ---------- datos ---------- */
const DATA=(window.STUDY_DATA||[]);
const MATCH=(window.MATCH_DATA||[]);
const ALL=[];
DATA.forEach(m=>m.questions.forEach(q=>ALL.push({...q,module:m.id,moduleName:m.name})));
ALL.forEach((q,i)=>q._gid='q'+i);

/* ---------- taxonomía (blueprint: dominios → subdominios) ---------- */
const SUBS={
 '1.1':'Agentic loop design','1.2':'Coordinator–subagent patterns','1.3':'Subagent spawning & context',
 '1.4':'Workflow enforcement & guardrails','1.5':'Agent SDK hooks','1.6':'Task decomposition & patterns','1.7':'Session management',
 '2.1':'Tool interface design','2.2':'Structured error handling','2.3':'Tool distribution & tool_choice',
 '2.4':'MCP servers & config','2.5':'Built-in tools',
 '3.1':'CLAUDE.md & memory','3.2':'Slash commands & skills','3.3':'Path-scoped rules','3.4':'Plan vs direct execution',
 '3.5':'Iterative refinement','3.6':'CI/CD & headless','3.7':'Settings, hooks & permissions',
 '4.1':'Precision & criteria','4.2':'Few-shot & prompt structure','4.3':'Structured output','4.4':'Validation & retry',
 '4.5':'Batch processing','4.6':'Multi-pass workflows',
 '5.1':'Context window & caching','5.2':'Long conversations & memory','5.3':'Errors & resilience',
 '5.4':'Retrieval at scale','5.5':'Provenance & auditability','5.6':'Evaluation & oversight'};
const SRC_LABELS={core:'core bank',repos:'community repos',ptest:'practical test',video1:'YT · 50Q',video2:'YT · traps',generated:'auto'};
const LVL_LABELS={basic:'Básico',intermediate:'Intermedio',advanced:'Avanzado'};

/* ---------- sesiones / perfiles ---------- */
const PKEY='cc_profiles';
let profiles=JSON.parse(localStorage.getItem(PKEY)||'{"users":[],"current":null}');
function saveProfiles(){localStorage.setItem(PKEY,JSON.stringify(profiles))}
function curUser(){return profiles.users.find(u=>u.email===profiles.current)}
const LSBASE='claudecert_ccaf_v1';
let LS=LSBASE,state={};
function loadState(){LS=profiles.current?LSBASE+'::'+profiles.current:LSBASE;state=JSON.parse(localStorage.getItem(LS)||'{}')}
function save(){localStorage.setItem(LS,JSON.stringify(state))}
function stt(gid){return (state[gid]||{}).status||null}
function setSt(gid,s){const st=state[gid]||{};st.status=s;state[gid]=st;save();const u=curUser();if(u){u.lastStudy=Date.now();saveProfiles()}syncProgress()}
/* registro de respuestas → repetición espaciada */
function recAnswer(gid,ok){
  const s=state[gid]||{};
  s.a=(s.a||0)+1;
  if(ok){s.c=(s.c||0)+1;s.streak=(s.streak||0)+1}else s.streak=0;
  s.last=Date.now();
  const days=[10/1440,1,3,7,14,30][Math.min(s.streak,5)];  // mal → 10 min; racha → 1/3/7/14/30 días
  s.due=Date.now()+days*86400e3;
  if(!s.status)s.status='seen';
  state[gid]=s;save();
  const u=curUser();if(u){u.lastStudy=Date.now();saveProfiles()}
  syncProgress();
}
let _syncT=null;
function syncProgress(){
  if(!profiles.current)return;
  clearTimeout(_syncT);
  _syncT=setTimeout(()=>{
    let known=0,seen=0,answered=0,correct=0;
    Object.values(state).forEach(v=>{if(v.status==='known')known++;if(v.status)seen++;if(v.a){answered+=v.a;correct+=v.c||0}});
    Cloud.pushProgress(profiles.current,{known,seen,answered,correct,total:ALL.length});
  },1500);
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
loadState();

function renderUserbox(){
  const box=document.getElementById('userbox');const u=curUser();
  box.innerHTML=u?`<div class="userchip" title="Cambiar de usuario"><b>👤 ${u.email}</b></div>`:'';
  const chip=box.querySelector('.userchip');if(chip)chip.onclick=()=>showLogin(true);
  const bell=document.getElementById('bell');
  bell.classList.toggle('on',!!(u&&u.notif));
  bell.onclick=toggleNotif;
}
function showLogin(allowClose){
  const ov=document.getElementById('loginOverlay');
  const others=profiles.users.filter(u=>u.verified).map(u=>`<div class="pitem" data-e="${u.email}">👤 ${u.email} <span style="color:var(--ok)">✔</span></div>`).join('');
  ov.innerHTML=`<div class="loginbox">
    <h2>🎓 claudeCert</h2>
    <p>Registrate con tu email para guardar tu progreso${Cloud.enabled?' (sincronizado en la nube)':' en este navegador'} y unirte a grupos de estudio. ${Cloud.enabled?'Te enviaremos un <b>link de verificación</b> a tu casilla.':'Vas a validar un <b>código de verificación</b>.'}</p>
    <input id="liEmail" type="email" placeholder="tu@email.com" autocomplete="email"/>
    <div class="err" id="liErr"></div>
    <button class="btn" id="liGo" style="width:100%">Registrarme / Entrar</button>
    ${others?`<p style="margin-top:16px">Sesiones ya verificadas en este navegador:</p><div class="plist">${others}</div>`:''}
    ${allowClose?'<button class="btn ghost" id="liClose" style="width:100%;margin-top:8px">Cancelar</button>':''}
  </div>`;
  ov.style.display='flex';
  const go=()=>{
    const em=document.getElementById('liEmail').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){document.getElementById('liErr').textContent='Ingresá un email válido.';return}
    const u=profiles.users.find(x=>x.email===em);
    if(u&&u.verified){finishLogin(em,false);return}   // ya verificado en este navegador
    startVerification(em,allowClose);
  };
  document.getElementById('liGo').onclick=go;
  document.getElementById('liEmail').onkeydown=e=>{if(e.key==='Enter')go()};
  ov.querySelectorAll('.pitem').forEach(p=>p.onclick=()=>finishLogin(p.dataset.e,false));
  const c=document.getElementById('liClose');if(c)c.onclick=()=>ov.style.display='none';
  setTimeout(()=>document.getElementById('liEmail').focus(),50);
}
async function startVerification(email,allowClose){
  const ov=document.getElementById('loginOverlay');
  ov.innerHTML=`<div class="loginbox"><h2>📨 Enviando verificación…</h2></div>`;
  let r;
  try{r=await Cloud.sendVerification(email)}
  catch(e){ov.innerHTML=`<div class="loginbox"><h2>⚠️ Error</h2><p>${e.message||e}</p><button class="btn" id="liBack" style="width:100%">Volver</button></div>`;
    document.getElementById('liBack').onclick=()=>showLogin(allowClose);return}
  if(r.mode==='email'){
    ov.innerHTML=`<div class="loginbox">
      <h2>📬 Revisá tu correo</h2>
      <p>Enviamos un <b>link de verificación</b> a <b>${email}</b>. Abrilo desde este dispositivo para completar el registro (mirá spam si no llega).</p>
      <button class="btn ghost" id="liResend" style="width:100%;margin-top:8px">Reenviar email</button>
      <button class="btn ghost" id="liBack" style="width:100%;margin-top:8px">Usar otro email</button>
    </div>`;
    document.getElementById('liResend').onclick=()=>startVerification(email,allowClose);
    document.getElementById('liBack').onclick=()=>showLogin(allowClose);
  } else {
    ov.innerHTML=`<div class="loginbox">
      <h2>🔑 Verificá tu email</h2>
      <p>Ingresá el código de 6 dígitos para <b>${email}</b>:</p>
      <div class="demonote">⚠ <b>Modo local (demo):</b> este sitio estático no tiene servidor de correo, así que el código se muestra acá abajo en lugar de llegar a tu casilla. Para envío por email real: configurar Firebase (instrucciones en <b>firebase-config.js</b> del repo).</div>
      <div class="verifycode">${r.code}</div>
      <input id="liCode" inputmode="numeric" maxlength="6" placeholder="······" style="text-align:center;letter-spacing:.3em;font-size:20px"/>
      <div class="err" id="liErr"></div>
      <button class="btn" id="liVerify" style="width:100%">Validar código</button>
      <button class="btn ghost" id="liBack" style="width:100%;margin-top:8px">Volver</button>
    </div>`;
    const ver=()=>{
      if(Cloud.verifyLocalCode(email,document.getElementById('liCode').value)){finishLogin(email,true)}
      else document.getElementById('liErr').textContent='Código incorrecto.';
    };
    document.getElementById('liVerify').onclick=ver;
    document.getElementById('liCode').onkeydown=e=>{if(e.key==='Enter')ver()};
    document.getElementById('liBack').onclick=()=>showLogin(allowClose);
    setTimeout(()=>document.getElementById('liCode').focus(),50);
  }
}
function finishLogin(email,justVerified){
  let u=profiles.users.find(x=>x.email===email);
  const isNew=!u;
  if(isNew){u={email,notif:false,lastStudy:null,verified:!!justVerified};profiles.users.push(u)}
  else if(justVerified)u.verified=true;

function mdToHtml(t){if(!t)return'';t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pickNext(){
  const cur=order[idx];
  const pool=list.map((q,i)=>({q,i})).filter(x=>x.i!==cur);
  if(!pool.length)return cur;
  const now=Date.now();
  const due=pool.filter(x=>{const s=state[x.q._gid];return s&&s.due&&s.due<=now});
  if(due.length){due.sort((a,b)=>state[a.q._gid].due-state[b.q._gid].due);return due[0].i}
  const unseen=pool.filter(x=>!stt(x.q._gid));
  if(unseen.length)return unseen[Math.floor(Math.random()*unseen.length)].i;
  const w=pool.map(x=>{const s=state[x.q._gid]||{};const acc=s.a?(s.c||0)/s.a:0.5;return Math.max(0.15,1.2-acc)});
  let t=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<pool.length;k++){t-=w[k];if(t<=0)return pool[k].i}
  return pool[pool.length-1].i;
}

function clickCard(el){
  if(el.classList.contains('matched'))return;
  if(!mSel){ if(el.dataset.side!=='t'){return} mSel=el;el.classList.add('sel');return }
  if(el===mSel){el.classList.remove('sel');mSel=null;return}
  if(el.dataset.side!=='d'){ mSel.classList.remove('sel'); if(el.dataset.side==='t'){mSel=el;el.classList.add('sel')} else mSel=null; return }
  // compare
  if(el.dataset.pid===mSel.dataset.pid){
    el.classList.add('matched');mSel.classList.add('matched');mSel.classList.remove('sel');mSel=null;
    mMatched++;updMemStats();
    if(mMatched===mTotal){clearInterval(mTimer);
      setTimeout(()=>alert(`🎉 ¡Ronda completa!\nTiempo: ${fmt(mSecs)}\nErrores: ${mErr}`),200);}
  } else {
    mErr++;updMemStats();const a=mSel,b=el;a.classList.add('bad');b.classList.add('bad');
    setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad')},380);mSel=null;
  }
}

function pickTerms(cat,correctTerm,n){
  let pool=(MATCH.find(c=>c.cat===cat)||{pairs:[]}).pairs.map(p=>p.t).filter(t=>t!==correctTerm);
  if(pool.length<n)pool=pool.concat(MATCH.flatMap(c=>c.pairs.map(p=>p.t)).filter(t=>t!==correctTerm));
  return shuffle([...new Set(pool)]).slice(0,n);
}
function buildExam(scope,nOpen){
  const sc=SCOPES[scope];
  const catPairs=MATCH.filter(c=>sc.cats.includes(c.cat)).flatMap(c=>c.pairs.map(p=>({...p,cat:c.cat})));
  const q=[];
  // 4 MC generadas desde los pares concepto/definición
  shuffle(catPairs).slice(0,4).forEach(p=>{
    const opts=shuffle([p.t,...pickTerms(p.cat,p.t,3)]);
    q.push({type:'mc',src:'generated',lvl:'basic',question:`Which concept matches this definition?\n\n"${p.d}"`,options:opts,correct:opts.indexOf(p.t)});
  });
  // 4 VF generadas
  shuffle(catPairs).slice(4,8).forEach((p,k)=>{
    const tru=Math.random()<0.5;let d=p.d;
    if(!tru){const others=catPairs.filter(x=>x.t!==p.t);d=(shuffle(others)[0]||p).d;}
    q.push({type:'vf',src:'generated',lvl:'basic',question:`The concept "${p.t}" is defined as:\n\n"${d}"`,correct:tru?'V':'F',
      answer:`The correct definition of "${p.t}" is: ${p.d}`});
  });
  // MC/VF reales del banco de preguntas dentro del alcance
  shuffle(ALL.filter(a=>sc.mods.includes(a.module)&&(a.type==='mc'||a.type==='vf'))).slice(0,8).forEach(a=>q.push({...a}));
  // desarrollo
  const opens=shuffle(ALL.filter(a=>sc.mods.includes(a.module)&&a.type==='open')).slice(0,nOpen);
  opens.forEach(a=>q.push({...a}));
  return shuffle(q);
}
/* examen formato certificación: cuotas por dominio según el blueprint oficial */
const DOMW=[['agentic',.27],['mcp',.18],['code',.20],['prompt',.20],['context',.15]];
const DOMNAMES={agentic:'Agentic Architecture (27%)',mcp:'Tools & MCP (18%)',code:'Claude Code (20%)',prompt:'Prompt Engineering (20%)',context:'Context & Reliability (15%)'};
const DOMCATS={agentic:['Agentic Architecture'],mcp:['Tools & MCP'],code:['Claude Code'],prompt:['Prompt Engineering'],context:['Context & Reliability']};
function prioQ(q){const s=state[q._gid];if(!s||!s.status)return 0;const acc=s.a?(s.c||0)/s.a:1;return acc<0.7?1:2}
function buildCertExam(n){
  const quotas=DOMW.map(([d,w])=>[d,Math.round(w*n)]);
  quotas[0][1]+=n-quotas.reduce((a,x)=>a+x[1],0);   // ajuste de redondeo al dominio de mayor peso
  const qs=[];
  quotas.forEach(([d,k])=>{
    let pool=shuffle(ALL.filter(a=>a.module===d&&a.type!=='open'));
    pool.sort((a,b)=>prioQ(a)-prioQ(b));            // no vistas primero, después débiles
    const take=pool.slice(0,k).map(x=>({...x}));
    const pairs=MATCH.filter(c=>DOMCATS[d].includes(c.cat)).flatMap(c=>c.pairs.map(p=>({...p,cat:c.cat})));
    while(take.length<k&&pairs.length){
      const p=shuffle(pairs)[0];
      const opts=shuffle([p.t,...pickTerms(p.cat,p.t,3)]);
      take.push({type:'mc',module:d,src:'generated',lvl:'basic',question:`Which concept matches this definition?\n\n"${p.d}"`,options:opts,correct:opts.indexOf(p.t)});
    }
    qs.push(...take);
  });
  return shuffle(qs);
}

  const durSel=+document.getElementById('exDur').value;
  if(fmt==='cert60'||fmt==='cert30'){
    const n=fmt==='cert60'?60:30;
    exam={q:buildCertExam(n),ans:{},cert:true};
    exLeft=(durSel>0?durSel:(durSel===-1?0:(n===60?120:60)))*60;
  } else {
    const scope=document.getElementById('exScope').value;
    const nOpen=+document.getElementById('exOpen').value;
    exam={q:buildExam(scope,nOpen),ans:{},scope};
    exLeft=(durSel>0?durSel:(durSel===-1?0:60))*60;
  }
  renderExamForm();
  clearInterval(exTimer);
  if(exLeft>0){exTimer=setInterval(()=>{exLeft--;const t=document.getElementById('exTimer');
    if(t){t.textContent=fmt2(exLeft);if(exLeft<300)t.classList.add('warn')}
    if(exLeft<=0){clearInterval(exTimer);gradeExam()}},1000);}
}
function fmt2(s){return fmt(s)}
function renderExamForm(){
  let html=`<main><div class="stage">
    <div class="toolbar" style="position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5">
      <b>Examen — ${exam.q.length} preguntas</b>
      <div class="progresswrap"><span class="timer" id="exTimer">${document.getElementById('exDur')?fmt(exLeft):'--'}</span>
      <button class="btn" id="exFinish">Finalizar y corregir</button></div>
    </div>`;
  exam.q.forEach((q,i)=>{
    html+=`<div class="exq" id="exq${i}"><div class="lbl"><span class="tag ${q.type}">${q.type==='vf'?'V/F':q.type==='mc'?'Opción múltiple':'Desarrollo'}</span>${q.sub?`<span class="tag mod">${q.sub}</span>`:''}${q.lvl&&q.lvl!=='basic'?`<span class="tag ${q.lvl}">${LVL_LABELS[q.lvl]}</span>`:''}<span class="qnum">Pregunta ${i+1}</span></div>
      <div class="question">${q.question}</div>
      ${q.diagram?`<div class="diag">${q.diagram}</div>`:''}
      ${q.code?`<pre class="codeblock">${esc(q.code)}</pre>`:''}`;
    if(q.type==='mc')html+='<div>'+q.options.map((o,j)=>`<div class="radio" data-q="${i}" data-v="${j}"><b>${String.fromCharCode(65+j)}</b> ${o}</div>`).join('')+'</div>';
    else if(q.type==='vf')html+='<div>'+['Verdadero','Falso'].map((o,j)=>`<div class="radio" data-q="${i}" data-v="${j===0?'V':'F'}">${o}</div>`).join('')+'</div>';
    else html+=`<textarea data-q="${i}" placeholder="Desarrollá tu respuesta acá…"></textarea>`;
    html+='</div>';
  });
  html+='</div></main>';
  app.innerHTML=html;
  app.querySelectorAll('.radio').forEach(r=>r.onclick=()=>{
    const qi=r.dataset.q;app.querySelectorAll(`.radio[data-q="${qi}"]`).forEach(x=>x.classList.remove('pick'));
    r.classList.add('pick');exam.ans[qi]=r.dataset.v;});
  app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>exam.ans[t.dataset.q]=t.value);
  document.getElementById('exFinish').onclick=()=>{if(confirm('¿Finalizar y corregir el examen?'))gradeExam()};
}
function gradeExam(){
  clearInterval(exTimer);
  let auto=0,autoMax=0,openMax=0;const openList=[];
  exam.q.forEach((q,i)=>{
    if(q.type==='mc'||q.type==='vf'){
      autoMax++;const a=exam.ans[i];
      const correct=q.type==='vf'?q.correct:String(q.correct);
      const given=q.type==='vf'?a:String(a===undefined?'':a);
      if(a===undefined){/*sin responder: 0*/}
      else if(given===correct)auto+=1;
      else if(!exam.cert)auto-=0.5;   // formato certificación: sin puntos negativos
    } else {openMax++;openList.push(i)}
  });
  exam._auto=auto;exam._autoMax=autoMax;exam._openMax=openMax;exam._openList=openList;exam._openScore={};
  renderExamResult();
}
function renderExamResult(){
  let html=`<main><div class="stage"><div id="resHead"></div>`;
  exam.q.forEach((q,i)=>{
    const a=exam.ans[i];
    html+=`<div class="exq"><div class="lbl"><span class="tag ${q.type}">${q.type==='vf'?'V/F':q.type==='mc'?'Opción múltiple':'Desarrollo'}</span>${q.sub?`<span class="tag mod">${q.sub}</span>`:''}${q.lvl&&q.lvl!=='basic'?`<span class="tag ${q.lvl}">${LVL_LABELS[q.lvl]}</span>`:''}<span class="qnum">Pregunta ${i+1}</span></div>
      <div class="question">${q.question}</div>
      ${q.diagram?`<div class="diag">${q.diagram}</div>`:''}
      ${q.code?`<pre class="codeblock">${esc(q.code)}</pre>`:''}`;
    if(q.type==='mc'){
      html+='<div>'+q.options.map((o,j)=>{let cls='radio';if(j===q.correct)cls+=' rcorrect';if(String(a)===String(j)&&j!==q.correct)cls+=' rwrong';
        return `<div class="${cls}"><b>${String.fromCharCode(65+j)}</b> ${o}</div>`}).join('')+'</div>';
      html+=resLine(a!==undefined&&String(a)===String(q.correct),a===undefined);
      if(q.answer)html+=`<div class="answer show"><div class="body">${mdToHtml(q.answer)}</div></div>`;
    } else if(q.type==='vf'){
      html+='<div>'+['V','F'].map(v=>{let cls='radio';if(v===q.correct)cls+=' rcorrect';if(a===v&&v!==q.correct)cls+=' rwrong';
        return `<div class="${cls}">${v==='V'?'Verdadero':'Falso'}</div>`}).join('')+'</div>';
      html+=resLine(a===q.correct,a===undefined);
      if(q.answer)html+=`<div class="answer show"><div class="body">${mdToHtml(q.answer)}</div></div>`;
    } else {
      html+=`<div style="margin:8px 0;padding:10px;background:#0d1117;border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;font-size:14px">${(a||'(sin responder)').replace(/</g,'&lt;')}</div>
        <div class="answer show"><h4>Respuesta modelo</h4><div class="body">${mdToHtml(q.answer)}</div></div>
        <div class="selfgrade"><span style="color:var(--muted);font-size:13px">Autocorrección:</span>
          <span class="sg g1" data-i="${i}" data-v="1">✔ Bien (1)</span>
          <span class="sg g05" data-i="${i}" data-v="0.5">◑ Parcial (0,5)</span>
          <span class="sg g0" data-i="${i}" data-v="0">✘ Mal (0)</span></div>`;
    }
    html+='</div>';
  });
  html+='</div></main>';
  app.innerHTML=html;
  app.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
    const i=b.dataset.i;app.querySelectorAll(`.sg[data-i="${i}"]`).forEach(x=>x.classList.remove('on'));
    b.classList.add('on');exam._openScore[i]=+b.dataset.v;updResult();});
  updResult();
  document.getElementById('resHead').scrollIntoView();
}
function resLine(ok,blank){return `<div style="margin-top:8px;font-weight:700;color:${blank?'var(--muted)':ok?'var(--ok)':'var(--bad)'}">${blank?'— Sin responder (0)':ok?'✔ Correcta (+1)':(exam.cert?'✘ Incorrecta (0)':'✘ Incorrecta (−0,5)')}</div>`}
function updResult(){
  const openScore=Object.values(exam._openScore).reduce((a,b)=>a+b,0);
  const graded=Object.keys(exam._openScore).length;
  const total=Math.max(0,exam._auto)+openScore;
  const max=exam._autoMax+exam._openMax;
  const pct=max?Math.round(total/max*100):0;
  const pass=pct>=72;
  const scaled=Math.round(100+900*(max?total/max:0));
  let domHtml='';
  if(exam.cert){
    domHtml='<div style="margin-top:16px;text-align:left;max-width:520px;margin-left:auto;margin-right:auto">'+
      DOMW.map(([d])=>{
        const qs=exam.q.map((q,i)=>({q,i})).filter(x=>x.q.module===d);
        if(!qs.length)return '';
        const ok=qs.filter(x=>{const a=exam.ans[x.i];if(a===undefined)return false;
          const corr=x.q.type==='vf'?x.q.correct:String(x.q.correct);return String(a)===corr}).length;
        const p=Math.round(ok/qs.length*100);
        return `<div class="dombar"><span class="nm">${DOMNAMES[d]}</span>
          <span class="pbar" style="flex:1"><i style="width:${p}%"></i></span>
          <b style="min-width:64px;text-align:right">${ok}/${qs.length}</b></div>`;
      }).join('')+'</div>';
  }
  document.getElementById('resHead').innerHTML=`<div class="card result">
    <div class="score ${pass?'pass':'fail'}">${pct}%</div>
    ${exam.cert?`<div style="font-size:16px;color:var(--muted)">puntaje escalado aprox.: <b style="color:var(--txt)">${scaled} / 1000</b> (corte: 720)</div>`:''}
    <div style="font-size:18px;margin:6px 0">${total.toFixed(1)} / ${max} puntos</div>
    ${exam._openMax?`<div style="color:var(--muted)">Objetivas: ${Math.max(0,exam._auto).toFixed(1)}/${exam._autoMax} · Desarrollo: ${openScore.toFixed(1)}/${exam._openMax} (${graded}/${exam._openMax} corregidas)</div>`:''}
    <div style="margin-top:10px;font-weight:700;color:${pass?'var(--ok)':'var(--bad)'}">${pass?'✔ Aprobado (≥72% ≈ 720/1000)':'✘ Debajo del corte (720/1000) — seguí repasando'}</div>
    ${domHtml}
    <button class="btn ghost" style="margin-top:16px" onclick="renderExamen()">Nuevo examen</button>
  </div>`;
}

/* ---------- router ---------- */
function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  if(m==='estudio')renderEstudio();
  else if(m==='memoria')renderMemoria();
  else if(m==='grupos')renderGrupos();
  else renderExamen();
}

/* ============ MODO GRUPOS ============ */
async function renderGrupos(){
  search.style.display='none';clearInterval(exTimer);
  const me=profiles.current;
  if(!me){showLogin(false);return}
  app.innerHTML=`<main><div class="stage">
    <h2 style="margin-top:4px">👥 Grupos de estudio ${Cloud.enabled?'<span class="tag srcx">☁ cloud</span>':'<span class="tag vf">modo local</span>'}</h2>
    ${Cloud.enabled?'':`<p style="color:var(--muted);font-size:13px">Sin backend configurado, los grupos y el progreso comparado viven en <b>este navegador</b> (sirve para una compu compartida). Para grupos reales entre dispositivos con emails de invitación: instrucciones en <b>firebase-config.js</b> del repo (5 min, gratis).</p>`}
    <div class="toolbar" style="gap:10px">
      <input class="search" id="gName" placeholder="Nombre del grupo nuevo"/>
      <button class="btn" id="gCreate">➕ Crear grupo</button>
      <span style="color:var(--border)">|</span>
      <input class="search" id="gCode" placeholder="Código (ej: AB3K9X)" style="min-width:150px;text-transform:uppercase"/>
      <button class="btn ghost" id="gJoin">Unirme con código</button>
    </div>
    <div id="gList" style="display:flex;flex-direction:column;gap:14px"><div class="empty">Cargando…</div></div>
  </div></main>`;
  document.getElementById('gCreate').onclick=async()=>{
    const n=document.getElementById('gName').value.trim();
    if(!n){alert('Poné un nombre para el grupo.');return}
    const g=await Cloud.createGroup(n,me);
    document.getElementById('gName').value='';
    renderGroupList();
    setTimeout(()=>alert(`Grupo "${g.name}" creado.\nCódigo de invitación: ${g.code}\n\nCompartí el código o el link de invitación (botón 🔗) con tus compañeros.`),100);
  };
  document.getElementById('gJoin').onclick=async()=>{
    const c=document.getElementById('gCode').value.trim();
    if(!c)return;
    try{const g=await Cloud.joinGroup(c,me);alert('✔ Te uniste a "'+g.name+'"')}catch(e){alert(e.message)}
    renderGroupList();
  };
  renderGroupList();
}
async function renderGroupList(){
  const me=profiles.current;const host=document.getElementById('gList');if(!host)return;
  let gs=[];try{gs=await Cloud.myGroups(me)}catch(e){}
  if(!gs.length){host.innerHTML='<div class="empty">Todavía no estás en ningún grupo.<br>Creá uno (2+ estudiantes) y compartí el código, o uníte con el código que te pasaron.</div>';return}
  const members=[...new Set(gs.flatMap(g=>g.members))];
  let prog={};try{prog=await Cloud.getProgress(members)}catch(e){}
  host.innerHTML=gs.map(g=>{
    const rows=[...g.members].sort((a,b)=>((prog[b]||{}).known||0)-((prog[a]||{}).known||0)).map((m,ri)=>{
      const p=prog[m]||{};const tot=p.total||ALL.length;
      const pct=tot?Math.round((p.known||0)/tot*100):0;
      const acc=p.answered?Math.round((p.correct||0)/p.answered*100):null;
      return `<div style="display:flex;align-items:center;gap:10px;margin:7px 0">
        <span style="min-width:24px;color:var(--muted)">${ri===0?'🥇':ri===1?'🥈':ri===2?'🥉':(ri+1)+'.'}</span>
        <span style="min-width:200px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m}${m===me?' <b style="color:var(--accent2)">(vos)</b>':''}</span>
        <span class="pbar" style="flex:1"><i style="width:${pct}%"></i></span>
        <span style="color:var(--muted);font-size:12.5px;min-width:170px;text-align:right">${p.known||0}/${tot} dominadas${acc!==null?' · '+acc+'% aciertos':''}</span></div>`;
    }).join('');
    const invite=location.origin+location.pathname+'?join='+g.code;
    return `<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">${g.name}</h3>
      <span class="tag mod">código: ${g.code}</span>
      <span class="tag srcx">${g.members.length} integrante${g.members.length>1?'s':''}</span>
      <span class="spacer"></span>
      <button class="btn ghost" data-inv="${invite}">🔗 Copiar invitación</button>
      <button class="btn ghost" data-leave="${g.code}">Salir</button></div>
      <div style="margin-top:12px">${rows}</div></div>`;
  }).join('');
  host.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.dataset.inv).then(()=>alert('Link de invitación copiado:\n'+b.dataset.inv));
  });
  host.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{
    if(confirm('¿Salir del grupo?')){await Cloud.leaveGroup(b.dataset.leave,me);renderGroupList()}
  });
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
search.oninput=()=>{if(mode==='estudio'){idx=0;drawCard()}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(mode==='estudio'){const n=document.getElementById('next'),p=document.getElementById('prev');
    if(e.key==='ArrowRight'&&n)n.click();if(e.key==='ArrowLeft'&&p)p.click();
    if(e.key===' '){const r=document.getElementById('reveal');if(r&&r.style.display!=='none'){e.preventDefault();r.click()}}}
});
window.renderExamen=renderExamen;
Cloud.init();
renderUserbox();
setMode('estudio');
(async()=>{
  let em=null;
  try{em=await Cloud.completeEmailLink()}catch(e){console.warn(e)}
  if(em){finishLogin(em,true);return}
  if(!profiles.current)showLogin(false);
  else{checkReminder();handleJoinParam();syncProgress()}
})();
</script>
